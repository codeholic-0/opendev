services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: opendev-postgres

    environment:
      POSTGRES_DB: opendev_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - opendev_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opendev_db"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  opendev_pg_data:
